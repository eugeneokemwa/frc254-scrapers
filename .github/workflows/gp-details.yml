# Tournament-details panel (arbiters, time control, format...) for chosen Grand Prix events, merged into the site's live
# assets/gp-details.js. Needs a real browser (the panel is bound to a session node). One tournament at a time, with pauses.
name: GP details
on:
  workflow_dispatch:
    inputs:
      ids: { description: "Site event ids, comma-separated (key or key=tnr)", default: "1538715,1538715_ladies" }
permissions:
  contents: read
concurrency: { group: gp-details, cancel-in-progress: false }
jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the site's current gp-details.js
        run: curl -fsSL --retry 3 -o assets/gp-details.js https://frc254.vercel.app/assets/gp-details.js
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tools/scrape-gp-details-playwright.py "${{ inputs.ids || '1538715,1538715_ladies' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gp-details
          path: assets/gp-details.js
