# Results for the events calendar: results links for finished events that have none (chess-results' tournament database, matched by
# name and dates), then the top three of every finished event with results (chess-results final ranking with performance ratings, or
# Lichess for online events). About 2 requests an event plus 3 per podium: one runner is far below chess-results' daily limit.
# Results are artifacts (assets/results-links.js, assets/podiums.js) to copy into the site.
name: Event results
on:
  workflow_dispatch:
    inputs:
      recheck_days: { description: "Look again for more section links on events that ended this many days ago or less", default: "14" }
permissions:
  contents: read
concurrency: { group: event-results, cancel-in-progress: false }
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The site's current data from the live site, so a run needs no push first. data.js is required; a missing league file only warns.
      - name: Fetch the site's current data
        run: |
          base=https://frc254.vercel.app/assets
          for f in data.js results-links.js podiums.js; do curl -fsSL --retry 3 -o "assets/$f" "$base/$f"; done
          for f in gp-league.js gp-league-2025.js; do curl -fsSL --retry 3 -o "assets/$f" "$base/$f" || echo "::warning::could not fetch $f"; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install requests beautifulsoup4
      - env: { RECHECK_DAYS: "${{ inputs.recheck_days || '14' }}" }
        run: python3 tools/sync-event-results.py || echo "sync stopped early (exit $?)"
      - run: python3 tools/fetch-podiums.py || echo "podiums stopped early (exit $?)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-results
          path: |
            assets/results-links.js
            assets/podiums.js
