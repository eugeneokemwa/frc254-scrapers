# Monthly FIDE ratings (standard, rapid, blitz) of the players in our games since 2020, from FIDE's archived lists (one zip per list),
# for "rating at the time of the game" on the site. 8 runners share the months; the merged file is the artifact "fide-history".
name: FIDE history
on:
  workflow_dispatch:
    inputs:
      months: { description: "First:last month", default: "2020-01:2026-11" }
      list: { description: "Only these months, comma-separated (a rerun of gaps)", default: "" }
permissions: { contents: read }
jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3, 4, 5, 6, 7, 8] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - timeout-minutes: 150
        run: python3 tools/fide-history.py --ids fide-ids.txt --months ${{ inputs.months }} --list "${{ inputs.list }}" --shard ${{ matrix.shard }}/8 --out hist-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "hist-${{ matrix.shard }}", path: "hist-${{ matrix.shard }}.json", if-no-files-found: ignore }
  merge:
    needs: lists
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "hist-*", path: parts, merge-multiple: true }
      - run: pip install requests && python3 tools/fide-history.py --merge parts/hist-*.json --out fide-history.json
      - uses: actions/upload-artifact@v4
        with: { name: fide-history, path: fide-history.json }
